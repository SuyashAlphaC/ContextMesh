services:
  hydra-init:
    image: ghcr.io/hydra-db/hydradb:0.1.1@sha256:db78309a233be54662db29744047e985a39b51c45a270d1a1f47c31a62cdb709
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data/store /data/cache && chown -R 10001:10001 /data"]
    volumes:
      - hydra-data:/data
  hydradb:
    image: ghcr.io/hydra-db/hydradb:0.1.1@sha256:db78309a233be54662db29744047e985a39b51c45a270d1a1f47c31a62cdb709
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9090:9090"
    depends_on:
      hydra-init:
        condition: service_completed_successfully
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /run/secrets/hydra-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      GRAPH_BOLT_BIND_ADDR: 0.0.0.0:7687
      GRAPH_HTTP_BIND_ADDR: 0.0.0.0:8443
      GRAPH_ADMIN_BIND_ADDR: 0.0.0.0:9090
      RUST_MIN_STACK: "33554432"
    volumes:
      - hydra-data:/data
      - ./deploy/hydra-token:/run/secrets/hydra-token:ro
    mem_limit: 2g
    restart: unless-stopped
volumes:
  hydra-data:
